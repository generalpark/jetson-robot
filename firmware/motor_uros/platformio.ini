; ESP32 + micro-ROS (ROS 2 Humble, 시리얼 전송)
; Jetson에서 micro-ROS Agent를 띄우면 ESP32가 ROS 2 노드로 붙는다.
[env:esp32_uros]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

board_microros_distro = humble
board_microros_transport = serial

upload_speed = 115200
upload_flags =
    --connect-attempts=20
