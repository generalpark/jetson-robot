; ESP32 DevKitC (WROOM-32D, CP2102)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

; 이 보드는 DTR/RTS 자동 리셋만으로는 다운로드 모드에 들어가지 않는다.
; esptool이 리셋을 거는 순간 BOOT(IO0)를 누르고 있으면 진입한다.
; 연결 시도 횟수를 늘려 버튼 조작 시간을 확보한다.
upload_speed = 115200
upload_flags =
    --connect-attempts=20
